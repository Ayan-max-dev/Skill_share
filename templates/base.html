<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SkillShare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#3C3489;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('auth.home') }}">SkillShare</a>
            <div>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.explore') }}">Explore</a>
                {% if current_user.is_authenticated %}
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.dashboard') }}">Dashboard</a>
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('profiles.my_profile') }}">My Profile</a>
                    <a class="btn btn-light btn-sm" href="{{ url_for('auth.logout') }}">Log Out</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('auth.login') }}">Log In</a>
                    <a class="btn btn-light btn-sm" href="{{ url_for('auth.add_user') }}">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
